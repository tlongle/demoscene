version: '3.8'

services:
  demoscene:
    build: .
    container_name: demoscene
    restart: unless-stopped
    ports:
      - "5363:5363"
    environment:
      - PORT=5363
      - DEMOPALS_DB_PATH=/app/data/demopals.db
      - ASSETS_DIR=/app/data/assets
      # Official IGDB / Twitch API Credentials for Box Art
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      # Security: Admin API Key & CORS Configuration
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Persistent storage for SQLite database and downloaded images
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5363/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
