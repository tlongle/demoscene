version: '3.8'

services:
  pbpx:
    build: .
    container_name: pbpx
    restart: unless-stopped
    ports:
      - "127.0.0.1:5363:5363"
    environment:
      - PORT=5363
      - PBPX_MODE=${PBPX_MODE:-selfhosted}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - BASE_URL=${BASE_URL:-http://localhost:5363}
      - PBPX_DB_PATH=/app/data/pbpx.db
      - DEMOPALS_DB_PATH=/app/data/demopals.db
      - ASSETS_DIR=/app/data/assets
      # Official IGDB / Twitch API Credentials for Box Art
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      # Security: Admin API Key & CORS Configuration
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Persistent storage for SQLite database and downloaded images
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5363/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
